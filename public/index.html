    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: max(884px, 100dvh); }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .ambient-shadow { box-shadow: 0 12px 40px rgba(44, 105, 78, 0.08); }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        .toast {
            animation: toastEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, toastLeave 0.3s ease-in forwards 3s;
        }
        @keyframes toastEnter {
            from { opacity: 0; transform: translateY(-20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastLeave {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex items-center justify-center p-4 md:p-8 relative overflow-x-hidden overflow-y-auto">
    <!-- Toast Notification -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none"></div>
    <!-- Ambient Background Elements -->
    <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-fixed/20 blur-[100px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-secondary-fixed/20 blur-[120px] pointer-events-none"></div>

    <div id="g_id_onload"
         data-client_id="243818682762-0gidrn9ft8vc5aff5fm3eognstfr4bdb.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <main class="pb-28 w-full max-w-xl relative z-10 animate-slide-up py-10">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full mb-4 shadow-[0_4px_20px_rgba(44,105,78,0.08)] bg-white overflow-hidden border border-surface-variant">
                <img src="logo.jpg" alt="Ghiras Alkhier Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="font-headline-md text-headline-md text-primary mb-2" id="formTitle">Welcome Back</h1>
            <p class="font-body-md text-body-md text-on-surface-variant" id="formSubtitle">Enter your details to access your sanctuary.</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-card rounded-xl p-6 md:p-8 ambient-shadow relative">
            
            <!-- Tab Switcher (Hide if not in login/register mode) -->
            <div id="tabSwitcher" class="flex bg-surface-container-highest rounded-full p-1 mb-8 relative">
                <div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-surface rounded-full shadow-sm transition-all duration-300 ease-in-out" id="tabIndicator"></div>
                <button id="loginTab" class="flex-1 py-2 font-label-md text-label-md text-primary z-10 transition-colors" onclick="switchTab('login')">Login</button>
                <button id="registerTab" class="flex-1 py-2 font-label-md text-label-md text-on-surface-variant z-10 transition-colors" onclick="switchTab('register')">Sign Up</button>
            </div>

            
            <!-- Login Form -->
            <form id="login-form" class="space-y-5 transition-opacity duration-300" onsubmit="handleAuth(event, 'login')">
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="login-email">Email Address</label>
                    <input id="login-email" type="email" required class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full px-6 py-4 font-body-md text-body-md text-on-surface transition-colors" placeholder="hello@ghirasalkhier.com" />
                </div>
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="login-password">Password</label>
                    <div class="relative">
                        <input id="login-password" type="password" required class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full px-6 py-4 pr-12 font-body-md text-body-md text-on-surface transition-colors" placeholder="••••••••" />
                        <button type="button" onclick="togglePassword('login-password')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="flex justify-end px-2">
                    <button type="button" onclick="showForgotPassword()" class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors">Forgot Password?</button>
                </div>
                <div id="login-error-msg" class="text-xs font-bold text-error text-center hidden"></div>
                <button type="submit" class="w-full bg-primary text-on-primary rounded-full py-4 font-label-md text-label-md shadow-[0_4px_20px_rgba(44,105,78,0.1)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">login</span>
                </button>

                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-surface-variant"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-surface-bright text-outline font-label-sm text-label-sm rounded-full">or continue with</span>
                    </div>
                </div>

                <!-- Social Auth -->
                <div class="flex justify-center w-full py-1">
                    <div class="g_id_signin transform scale-[1.15] origin-center"
                         data-type="standard"
                         data-shape="pill"
                         data-theme="outline"
                         data-text="signin_with"
                         data-size="medium"
                         data-logo_alignment="left"
                         data-width="260"
                         data-locale="en">
                    </div>
                </div>
            </form>

            <!-- Register Form (Initially Hidden) -->
            <form id="register-form" class="hidden opacity-0 transition-opacity duration-300 space-y-4" onsubmit="handleAuth(event, 'register')">
                <div id="gender-dropdown-container">
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="register-gender">Gender</label>
                    <div class="relative group">
                        <button type="button" id="gender-btn" onclick="toggleGenderDropdown()" class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full px-5 py-3 font-body-md text-body-md text-on-surface-variant transition-colors flex items-center justify-between">
                            <span id="gender-selected-text">Select</span>
                            <span class="material-symbols-outlined text-[20px]" id="gender-icon">expand_more</span>
                        </button>
                        <div id="gender-options" class="absolute z-20 w-full mt-2 bg-surface-container-lowest border border-surface-variant rounded-2xl shadow-xl hidden overflow-hidden origin-top scale-95 opacity-0 transition-all duration-200 p-2">
                            <button type="button" onclick="selectGender('male', 'Male')" class="w-full text-left px-4 py-3 text-sm font-medium text-on-surface hover:bg-surface-container hover:text-primary rounded-xl transition-colors flex items-center gap-3">
                                <span class="material-symbols-outlined text-[18px]">male</span> Male
                            </button>
                            <button type="button" onclick="selectGender('female', 'Female')" class="w-full text-left px-4 py-3 text-sm font-medium text-on-surface hover:bg-surface-container hover:text-primary rounded-xl transition-colors flex items-center gap-3">
                                <span class="material-symbols-outlined text-[18px]">female</span> Female
                            </button>
                        </div>
                        <input type="hidden" id="register-gender" value="">
                    </div>
                </div>
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="register-email">Email Address</label>
                    <input id="register-email" type="email" required class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full px-5 py-3 font-body-md text-body-md text-on-surface transition-colors" placeholder="hello@ghirasalkhier.com" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="register-password">Password</label>
                        <div class="relative">
                            <input id="register-password" type="password" required class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full py-3 pl-5 pr-10 font-body-md text-body-md text-on-surface transition-colors" placeholder="Password" />
                            <button type="button" onclick="togglePassword('register-password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors">
                                <span class="material-symbols-outlined text-[18px]">visibility</span>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="register-password-confirm">Confirm</label>
                        <div class="relative">
                            <input id="register-password-confirm" type="password" required class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full py-3 pl-5 pr-10 font-body-md text-body-md text-on-surface transition-colors" placeholder="Confirm" />
                            <button type="button" onclick="togglePassword('register-password-confirm')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors">
                                <span class="material-symbols-outlined text-[18px]">visibility</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="register-error-msg" class="text-xs font-bold text-error text-center mt-1 hidden"></div>
                <button type="submit" class="w-full bg-primary text-on-primary rounded-full py-4 font-label-md text-label-md shadow-[0_4px_20px_rgba(44,105,78,0.1)] hover:opacity-90 active:scale-[0.98] transition-all mt-4 flex justify-center items-center gap-2">
                    Create Account
                    <span class="material-symbols-outlined text-[18px]">person_add</span>
                </button>

                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-surface-variant"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-surface-bright text-outline font-label-sm text-label-sm rounded-full">or sign up with</span>
                    </div>
                </div>

                <!-- Social Auth -->
                <div class="flex justify-center w-full py-1">
                    <div class="g_id_signin transform scale-[1.15] origin-center"
                         data-type="standard"
                         data-shape="pill"
                         data-theme="outline"
                         data-text="signup_with"
                         data-size="medium"
                         data-logo_alignment="left"
                         data-width="260"
                         data-locale="en">
                    </div>
                </div>

            </form>

            <!-- Forgot Password Form -->
            <form id="forgot-password-form" class="hidden opacity-0 transition-opacity duration-300 space-y-5" onsubmit="handleForgotPassword(event)">
                <div class="mb-2">
                    <p class="font-body-md text-sm text-on-surface-variant">Enter your email address and we'll send you a code to reset your password.</p>
                </div>
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="forgot-email">Email Address</label>
                    <input id="forgot-email" type="email" required class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full px-6 py-4 font-body-md text-body-md text-on-surface transition-colors" placeholder="hello@ghirasalkhier.com" />
                </div>
                <div id="forgot-error-msg" class="text-xs font-bold text-error text-center hidden"></div>
                <button type="submit" class="w-full bg-primary text-on-primary rounded-full py-4 font-label-md text-label-md shadow-[0_4px_20px_rgba(44,105,78,0.1)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Send Reset Code
                    <span class="material-symbols-outlined text-[18px]">send</span>
                </button>
                <button type="button" onclick="switchTab('login')" class="w-full mt-2 font-label-sm text-label-sm text-outline hover:text-on-surface transition-colors text-center">Back to Login</button>
            </form>

            <!-- OTP Form -->
            <form id="otp-form" class="hidden opacity-0 transition-opacity duration-300 space-y-6" onsubmit="verifyOTP(event)">
                <div class="text-center mb-2">
                    <p class="font-body-md text-sm text-on-surface-variant">We've sent a 4-digit code to <br><span id="otp-email-display" class="font-bold text-primary"></span></p>
                </div>
                <div class="flex justify-center gap-3 w-full max-w-[280px] mx-auto">
                    <input type="text" id="otp-1" maxlength="1" inputmode="numeric" pattern="[0-9]*" required class="w-14 h-16 text-center text-2xl font-bold bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-2xl transition-all text-on-surface" oninput="handleOtpInput(this, 'otp-2')" onkeydown="handleOtpKeydown(event, this, null)" onpaste="handleOtpPaste(event)">
                    <input type="text" id="otp-2" maxlength="1" inputmode="numeric" pattern="[0-9]*" required class="w-14 h-16 text-center text-2xl font-bold bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-2xl transition-all text-on-surface" oninput="handleOtpInput(this, 'otp-3')" onkeydown="handleOtpKeydown(event, this, 'otp-1')" onpaste="handleOtpPaste(event)">
                    <input type="text" id="otp-3" maxlength="1" inputmode="numeric" pattern="[0-9]*" required class="w-14 h-16 text-center text-2xl font-bold bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-2xl transition-all text-on-surface" oninput="handleOtpInput(this, 'otp-4')" onkeydown="handleOtpKeydown(event, this, 'otp-2')" onpaste="handleOtpPaste(event)">
                    <input type="text" id="otp-4" maxlength="1" inputmode="numeric" pattern="[0-9]*" required class="w-14 h-16 text-center text-2xl font-bold bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-2xl transition-all text-on-surface" oninput="handleOtpInput(this, null)" onkeydown="handleOtpKeydown(event, this, 'otp-3')" onpaste="handleOtpPaste(event)">
                </div>
                <div id="otp-error-msg" class="text-xs font-bold text-error text-center hidden">Invalid code. Please try again.</div>
                <button type="submit" id="verify-btn" class="w-full bg-primary text-on-primary rounded-full py-4 font-label-md text-label-md shadow-[0_4px_20px_rgba(44,105,78,0.1)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Verify Code
                    <span class="material-symbols-outlined text-[18px]">verified</span>
                </button>
                <div class="flex justify-between items-center mt-2 px-1">
                    <button type="button" onclick="goBackFromOTP()" class="text-sm font-label-sm text-outline hover:text-on-surface transition-colors">Change email</button>
                    <button type="button" id="resend-otp-btn" onclick="resendOTP()" class="text-sm font-label-sm text-primary hover:text-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Resend code</button>
                </div>
            </form>

            <!-- Reset Password Form -->
            <form id="reset-password-form" class="hidden opacity-0 transition-opacity duration-300 space-y-5" onsubmit="handleResetPassword(event)">
                <div class="mb-2">
                    <p class="font-body-md text-sm text-on-surface-variant">Please enter and confirm your new password.</p>
                </div>
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="reset-password">New Password</label>
                    <div class="relative">
                        <input id="reset-password" type="password" required class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full px-6 py-4 pr-12 font-body-md text-body-md text-on-surface transition-colors" placeholder="Create a strong password" />
                        <button type="button" onclick="togglePassword('reset-password')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-4" for="reset-password-confirm">Confirm New Password</label>
                    <div class="relative">
                        <input id="reset-password-confirm" type="password" required class="w-full bg-surface-bright border border-transparent focus:border-primary focus:ring-0 rounded-full px-6 py-4 pr-12 font-body-md text-body-md text-on-surface transition-colors" placeholder="Confirm your new password" />
                        <button type="button" onclick="togglePassword('reset-password-confirm')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>
                <div id="reset-error-msg" class="text-xs font-bold text-error text-center mt-1 hidden"></div>
                <button type="submit" class="w-full bg-primary text-on-primary rounded-full py-4 font-label-md text-label-md shadow-[0_4px_20px_rgba(44,105,78,0.1)] hover:opacity-90 active:scale-[0.98] transition-all mt-4 flex items-center justify-center gap-2">
                    Update Password
                    <span class="material-symbols-outlined text-[18px]">lock_reset</span>
                </button>
            </form>

        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 z-50 rounded-xl backdrop-blur-md bg-surface-bright/60 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
            <svg class="animate-spin h-10 w-10 text-primary mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="font-label-md text-label-md text-on-surface" id="loading-text">Authenticating...</p>
        </div>

    </main>

    <!-- JS Logic -->
    <script>
        let pendingRegistration = null;
        let pendingPasswordReset = null;
        let authMode = 'register';
        let generatedOTP = null;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzk5GVP8SVTxkehxIodIctApIsf1vObvPeF66Jtf9nhbDbfzhw8FgMpw6nG9-WlMfUizg/exec';
        const RESET_GAS_URL = 'https://script.google.com/macros/s/AKfycbyr4qdm2CiKs9cP3PpdfDbfvOkjvm8C49orpRWt7iS0-DyjRQtYESuhMyvtUFKvlcwCwQ/exec';

        
        
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const isError = type === 'error';

        async function getCountry() {

                const ipRes = await fetch('https://ipwho.is/');
                const ipData = await ipRes.json();
                if (ipData && ipData.success && ipData.country) {
                    return ipData.country;
                }
            } catch(e) {}
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                if (ipData && ipData.country_name) {
                    return ipData.country_name;
                }
            } catch(e) {}
            return 'Unknown';
        }

        function handleAuth(e, type) {
            e.preventDefault();
            const emailInput = document.getElementById(type + '-email').value;
            const passwordInput = document.getElementById(type + '-password').value;

            if (type === 'register') {
                const nameInput = "";
                const phoneInput = "";
                const genderInput = document.getElementById('register-gender').value;
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const passwordConfirmInput = document.getElementById('register-password-confirm').value;

                if (!genderInput) {
                    const btn = document.getElementById('gender-btn');
                    const errorMsg = document.getElementById('register-error-msg');
                    btn.classList.add('border-error');
                    errorMsg.textContent = 'Please select a gender.';
                    errorMsg.classList.remove('hidden');
                    return;
                }

                if (passwordInput !== passwordConfirmInput) {
                    const registerPasswordConfirmInput = document.getElementById('register-password-confirm');
                    const errorMsg = document.getElementById('register-error-msg');
                    registerPasswordConfirmInput.classList.add('border-error', 'border');
                    errorMsg.textContent = 'Passwords do not match.';
                    errorMsg.classList.remove('hidden');
                    const clearPasswordError = () => {
                        registerPasswordConfirmInput.classList.remove('border-error', 'border');
                        if (errorMsg.textContent === 'Passwords do not match.') errorMsg.classList.add('hidden');
                        registerPasswordConfirmInput.removeEventListener('input', clearPasswordError);
                    };
                    registerPasswordConfirmInput.addEventListener('input', clearPasswordError);
                    return;
                }

                const englishRegex = /^[a-zA-Z0-9!@#\$%^\&*\)\(+=._-]+$/g;
                if (!englishRegex.test(passwordInput)) {
                    const registerPasswordInput = document.getElementById('register-password');
                    const errorMsg = document.getElementById('register-error-msg');
                    registerPasswordInput.classList.add('border-error', 'border');
                    errorMsg.textContent = 'Password must use English letters only.';
                    errorMsg.classList.remove('hidden');
                    const clearLangError = () => {
                        registerPasswordInput.classList.remove('border-error', 'border');
                        if (errorMsg.textContent === 'Password must use English letters only.') errorMsg.classList.add('hidden');
                        registerPasswordInput.removeEventListener('input', clearLangError);
                    };
                    registerPasswordInput.addEventListener('input', clearLangError);
                    return;
                }

                const loadingText = document.getElementById('loading-text');
                loadingText.textContent = 'Checking email...';
                overlay.classList.remove('hidden');
                setTimeout(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); }, 10);

                // First check if email already exists
                fetch('/api/auth/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.exists) {
                        overlay.classList.remove('opacity-100');
                        overlay.classList.add('opacity-0');
                        setTimeout(() => overlay.classList.add('hidden'), 300);
                        showToast('This email is already in use.', 'error');
                        return;
                    }
                    
                    // Proceed with OTP if email doesn't exist
                    authMode = 'register';
                    generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
                    pendingRegistration = { name: nameInput, email: emailInput, phone: phoneInput, gender: genderInput, password: passwordInput };

                    loadingText.textContent = 'Sending code...';

                    console.log("Sending OTP to:", emailInput, "Code:", generatedOTP);
                    fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: emailInput, otp: generatedOTP })
                    }).then(() => {
                        setTimeout(() => {
                            overlay.classList.remove('opacity-100');
                            overlay.classList.add('opacity-0');
                            setTimeout(() => overlay.classList.add('hidden'), 300);
                            
                            document.getElementById('tabSwitcher').classList.add('hidden');
                            document.getElementById('formTitle').textContent = 'Verify Email';
                            document.getElementById('formSubtitle').textContent = 'Almost there.';

                            hideAllForms();
                            showForm('otp-form');
                            document.getElementById('otp-email-display').textContent = emailInput;
                            document.getElementById('otp-1').focus();
                        }, 500);
                    }).catch(error => {
                        console.error("Error sending OTP:", error);
                        alert("There was an error sending the verification email. Please try again later.");
                        overlay.classList.remove('opacity-100');
                        overlay.classList.add('opacity-0');
                        setTimeout(() => overlay.classList.add('hidden'), 300);
                    });
                })
                .catch(err => {
                    console.error("Error checking email:", err);
                    showToast('Server error. Please try again.', 'error');
                    overlay.classList.remove('opacity-100');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                });

            } else if (type === 'login') {
                const errorMsg = document.getElementById('login-error-msg');
                errorMsg.classList.add('hidden');

                const overlay = document.getElementById('loading-overlay');
                document.getElementById('loading-text').textContent = 'Authenticating...';
                overlay.classList.remove('hidden');
                setTimeout(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); }, 10);

                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput, password: passwordInput })
                })
                .then(res => res.json().then(data => ({ status: res.status, data })))
                .then(({ status, data }) => {
                    if (status !== 200) {
                        overlay.classList.remove('opacity-100');
                        overlay.classList.add('opacity-0');
                        setTimeout(() => overlay.classList.add('hidden'), 300);
                        
                        showToast(data.error || 'Login failed', 'error');
                    } else {
                        if (data.token) localStorage.setItem('token', data.token);
                        const userData = data.user || data;
                        localStorage.setItem('currentUser', JSON.stringify({ 
                            name: (userData.firstName || '') + (userData.lastName ? ' ' + userData.lastName : ''), 
                            email: userData.email, 
                            phone: userData.phone, 
                            gender: userData.gender,
                            role: userData.role
                        }));
                        setTimeout(() => { window.location.href = 'home.html'; }, 1200);

                })
                .catch(err => {
                    overlay.classList.remove('opacity-100');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                    errorMsg.textContent = 'Server error. Please try again.';
                    errorMsg.classList.remove('hidden');
                });
            }
        }

        function handleOtpInput(currentInput, nextInputId) {
            currentInput.value = currentInput.value.replace(/[^0-9]/g, '');
            if (currentInput.value.length === 1 && nextInputId) document.getElementById(nextInputId).focus();
            resetOtpErrorState();
        }

        function handleOtpKeydown(event, currentInput, prevInputId) {
            const allowedKeys = ['Backspace', 'Delete', 'Tab', 'Escape', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
            if (allowedKeys.includes(event.key)) {
                if (event.key === 'Backspace' && currentInput.value.length === 0 && prevInputId) document.getElementById(prevInputId).focus();
                return;
            }
            if ((event.ctrlKey || event.metaKey) && event.key === 'v') return;
            if ((event.ctrlKey || event.metaKey) && ['a', 'c', 'x'].includes(event.key)) return;
            if (!/^[0-9]$/.test(event.key)) event.preventDefault();
        }

        function handleOtpPaste(event) {
            event.preventDefault();
            const pastedData = (event.clipboardData || window.clipboardData).getData('text');
            const digits = pastedData.replace(/[^0-9]/g, '').split('');
            const otpInputs = ['otp-1', 'otp-2', 'otp-3', 'otp-4'];
            otpInputs.forEach((id, index) => {
                document.getElementById(id).value = digits[index] || '';
            });
            const nextEmpty = otpInputs.find(id => document.getElementById(id).value === '');
            if (nextEmpty) document.getElementById(nextEmpty).focus();
            else document.getElementById('otp-4').focus();
            resetOtpErrorState();
        }

        function handleResetPassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('reset-password').value;
            const confirmPassword = document.getElementById('reset-password-confirm').value;
            if (newPassword !== confirmPassword) {
                const confirmInput = document.getElementById('reset-password-confirm');
                const errorMsg = document.getElementById('reset-error-msg');
                confirmInput.classList.add('border-error', 'border');
                errorMsg.textContent = 'Passwords do not match.';
                errorMsg.classList.remove('hidden');
                const clearError = () => {
                    confirmInput.classList.remove('border-error', 'border');
                    errorMsg.classList.add('hidden');
                    confirmInput.removeEventListener('input', clearError);
                };
                confirmInput.addEventListener('input', clearError);
                return;
            }
            const englishRegex = /^[a-zA-Z0-9!@#\$%\^\&*\)\(+=._-]+$/g;
            if (!englishRegex.test(newPassword)) {
                const passwordInput = document.getElementById('reset-password');
                const errorMsg = document.getElementById('reset-error-msg');
                passwordInput.classList.add('border-error', 'border');
                errorMsg.textContent = 'Password must use English letters only.';
                errorMsg.classList.remove('hidden');
                const clearLangError = () => {
                    passwordInput.classList.remove('border-error', 'border');
                    if (errorMsg.textContent === 'Password must use English letters only.') errorMsg.classList.add('hidden');
                    passwordInput.removeEventListener('input', clearLangError);
                };
                passwordInput.addEventListener('input', clearLangError);
                return;
            }
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const userIndex = users.findIndex(u => u.email === pendingPasswordReset.email);
            if (userIndex !== -1) {
                users[userIndex].password = newPassword;
                localStorage.setItem('users', JSON.stringify(users));
                const overlay = document.getElementById('loading-overlay');
                document.getElementById('loading-text').textContent = 'Password updated...';
                overlay.classList.remove('hidden');
                setTimeout(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); }, 10);
                setTimeout(() => {
                    overlay.classList.remove('opacity-100');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                    document.getElementById('reset-password').value = '';
                    document.getElementById('reset-password-confirm').value = '';
                    pendingPasswordReset = null;
                    switchTab('login');
                }, 1200);
            }
        }
    </script>
</body>
</html>
