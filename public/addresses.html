<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="utf-8"/>
<meta name="viewport" content="width=400, user-scalable=no">
<title>My Addresses - Ghiras Alkhier</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<script src="purify.min.js"></script>
    <script src="loader.js"></script>
<script>
    if (!localStorage.getItem('currentUser') || !localStorage.getItem('token')) {
        window.location.href = 'index.html';
    }
</script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                },
                colors: {
                    primary: '#135c38',
                    'primary-light': '#bcebd2',
                    surface: '#fbf9f8',
                    'surface-dim': '#f5f3f3',
                    text: '#3d4943',
                    'text-muted': '#6b7a73',
                },
                borderRadius: {
                    '4xl': '2rem',
                }
            }
        }
    }
</script>
<style type="text/tailwindcss">
    @layer utilities {
        .shadow-soft { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        .shadow-ambient { box-shadow: 0 12px 40px rgba(19, 92, 56, 0.08); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    }
    body {
        background-color: theme('colors.surface');
        color: theme('colors.text');
    }
</style>
<!-- Leaflet Maps -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
    .leaflet-container { z-index: 10; font-family: inherit; }
    .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.1) !important; }
    .leaflet-control-zoom a { color: #135c38 !important; border-radius: 8px !important; }
    .leaflet-control-attribution { display: none !important; }
</style>
</head>
<body class="antialiased font-sans flex flex-col h-full relative">

<!-- Header (Floating) -->
<header class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center pointer-events-none max-w-xl left-1/2 -translate-x-1/2">
    <button class="pointer-events-auto h-12 w-12 flex items-center justify-center rounded-full bg-white/80 backdrop-blur-md text-primary shadow-soft hover:bg-white transition-colors" onclick="window.location.href='profile.html'">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div class="pointer-events-auto font-bold text-lg text-primary bg-white/80 backdrop-blur-md px-6 py-3 rounded-full shadow-soft">
        My Addresses
    </div>
    <div class="w-12 h-12"></div> <!-- Spacer -->
</header>

<main class="w-full max-w-xl mx-auto pt-24 px-6 pb-28">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-text">Saved Addresses</h2>
        <button onclick="openNewAddressModal()" class="text-sm font-semibold text-primary bg-primary/10 px-4 py-2 rounded-full hover:bg-primary/20 transition-colors">
            + Add New
        </button>
    </div>

    <div id="addresses-list" class="flex flex-col gap-4">
        <!-- Addresses injected here -->
        <div class="flex items-center justify-center h-32">
            <span class="material-symbols-outlined animate-spin text-primary">progress_activity</span>
        </div>
    </div>
</main>

<!-- New Address Modal -->
<div id="new-address-modal" class="fixed inset-0 z-50 flex items-end justify-center hidden bg-black/30 backdrop-blur-sm transition-opacity">
    <div class="bg-surface w-full max-w-xl h-[90vh] rounded-t-[2.5rem] flex flex-col overflow-hidden transform translate-y-full transition-transform duration-300 shadow-2xl">
        <header class="relative px-6 py-5 border-b border-surface-dim bg-white flex justify-between items-center z-20 shadow-sm">
            <button onclick="closeNewAddressModal()" class="w-10 h-10 rounded-full hover:bg-surface-dim flex items-center justify-center transition-colors text-text-muted">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h3 class="font-bold text-lg text-text">Address Details</h3>
            <div class="w-10"></div>
        </header>
        <div class="flex-1 overflow-y-auto pb-32 relative">
            <div id="map" class="w-full h-64 z-10 bg-surface-dim"></div>
            
            <div class="px-6 py-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1 ml-2">Address Name *</label>
                    <input id="addr-label" type="text" class="w-full bg-white border border-surface-dim focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1 ml-2">Building Number / Name *</label>
                    <input id="addr-building" type="text" class="w-full bg-white border border-surface-dim focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col justify-end">
                        <label class="block text-xs font-semibold text-text-muted mb-1 ml-2">Floor / Apt <span class="text-[10px] font-normal opacity-70">(Optional)</span></label>
                        <input id="addr-floor" type="text" class="w-full bg-white border border-surface-dim focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-sm">
                    </div>
                    <div class="flex flex-col justify-end">
                        <label class="block text-xs font-semibold text-text-muted mb-1 ml-2">Extra Details <span class="text-[10px] font-normal opacity-70">(Optional)</span></label>
                        <input id="addr-details" type="text" class="w-full bg-white border border-surface-dim focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-sm">
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-surface-dim p-4 pb-8 z-[70]">
            <button id="btn-save-address" onclick="saveNewAddress()" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-full shadow-ambient transition-all flex justify-center items-center gap-2">
                Save Address
                <span class="material-symbols-outlined">save</span>
            </button>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 pointer-events-none opacity-0 -translate-y-4">
    <div class="bg-text text-white px-6 py-3 rounded-full shadow-ambient font-medium text-sm flex items-center gap-2">
        <span id="toast-icon" class="material-symbols-outlined text-[20px]">info</span>
        <span id="toast-msg">Notification</span>
    </div>
</div>

<script>
    let addresses = [];
    let map = null;
    let marker = null;
    let editingAddressId = null;

    document.addEventListener('DOMContentLoaded', () => {
        fetchUserAddresses();
    });

    async function fetchUserAddresses() {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) return;
        
        try {
            const res = await fetch(`/api/addresses/${currentUser.email}`);
            addresses = await res.json();
        if (!res.ok) { console.error(addresses); return; }
            renderAddresses();
        } catch (err) {
            console.error('Error fetching addresses:', err);
        }
    }

    function renderAddresses() {
        const container = document.getElementById('addresses-list');
        container.innerHTML = '';
        
        if (addresses.length === 0) {
            container.innerHTML = '<p class="text-center text-text-muted text-sm py-12">No saved addresses found.</p>';
            return;
        }

        addresses.forEach((addr) => {
            const title = addr.label && addr.label.trim() !== '' ? addr.label : addr.building;
            const subtitle = (addr.label && addr.label.trim() !== '' ? addr.building + ' - ' : '') + 
                             (addr.floor ? addr.floor + ', ' : '') + 
                             (addr.details || '');

            const html = `
            <div class="flex items-center gap-4 p-4 rounded-3xl border border-surface-dim bg-white shadow-soft group hover:border-primary/30 transition-all">
                <div class="w-10 h-10 rounded-full bg-surface-dim text-text-muted group-hover:bg-primary/10 group-hover:text-primary flex items-center justify-center shrink-0 transition-colors">
                    <span class="material-symbols-outlined text-[24px]">location_on</span>
                </div>
                <div class="flex-1">
                    <h4 class="font-bold text-text">${title}</h4>
                    <p class="text-xs text-text-muted truncate">${subtitle}</p>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="editAddress(event, ${addr.id})" class="w-10 h-10 rounded-full hover:bg-surface flex items-center justify-center text-text-muted hover:text-primary transition-colors">
                        <span class="material-symbols-outlined text-[20px]">edit</span>
                    </button>
                    <button onclick="deleteAddress(event, ${addr.id})" class="w-10 h-10 rounded-full hover:bg-red-50 flex items-center justify-center text-text-muted hover:text-red-500 transition-colors">
                        <span class="material-symbols-outlined text-[20px]">delete</span>
                    </button>
                </div>
            </div>
            `;
            container.innerHTML += html;
        });
    }

    function openNewAddressModal() {
        editingAddressId = null;
        const modal = document.getElementById('new-address-modal');
        modal.classList.remove('hidden');
        
        // Reset fields
        document.getElementById('addr-label').value = '';
        document.getElementById('addr-building').value = '';
        document.getElementById('addr-floor').value = '';
        document.getElementById('addr-details').value = '';

        setTimeout(() => {
            modal.firstElementChild.classList.remove('translate-y-full');
            if (!map) {
                initMap();
            } else {
                map.invalidateSize();
            }
        }, 10);
    }
    
    function editAddress(event, id) {
        event.stopPropagation();
        const addr = addresses.find(a => a.id === id);
        if (!addr) return;
        
        editingAddressId = id;
        const modal = document.getElementById('new-address-modal');
        modal.classList.remove('hidden');
        
        document.getElementById('addr-label').value = addr.label || '';
        document.getElementById('addr-building').value = addr.building || '';
        document.getElementById('addr-floor').value = addr.floor || '';
        document.getElementById('addr-details').value = addr.details || '';
        
        setTimeout(() => {
            modal.firstElementChild.classList.remove('translate-y-full');
            if (!map) {
                initMap();
            }
            if (map) {
                map.invalidateSize();
                if (addr.latitude && addr.longitude) {
                    map.setView([addr.latitude, addr.longitude], 15);
                    if (marker) marker.setLatLng([addr.latitude, addr.longitude]);
                }
            }
        }, 10);
    }

    async function deleteAddress(event, id) {
        event.stopPropagation();
        if (!confirm('Are you sure you want to delete this address?')) return;
        
        try {
            const res = await fetch(`/api/addresses/${id}`, { method: 'DELETE' });
            if (res.ok) {
                showToast('Address deleted successfully', 'success');
                fetchUserAddresses();
            } else {
                showToast('Failed to delete address', 'error');
            }
        } catch (err) {
            console.error(err);
            showToast('Error deleting address', 'error');
        }
    }

    function closeNewAddressModal() {
        const modal = document.getElementById('new-address-modal');
        modal.firstElementChild.classList.add('translate-y-full');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    function initMap() {
        const defaultLat = 24.7136;
        const defaultLng = 46.6753;

        map = L.map('map').setView([defaultLat, defaultLng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        const customIcon = L.divIcon({
            className: 'custom-pin-svg',
            html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" style="width:32px;height:48px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); transform: translate(-4px, -12px)">
                     <path fill="#135c38" stroke="#ffffff" stroke-width="1.5" d="M12 1.5C6.2 1.5 1.5 6.2 1.5 12c0 7.5 10.5 22.5 10.5 22.5s10.5-15 10.5-22.5C22.5 6.2 17.8 1.5 12 1.5z"/>
                     <circle cx="12" cy="12" r="4.5" fill="#ffffff"/>
                   </svg>`,
            iconSize: [24, 36],
            iconAnchor: [12, 36]
        });

        marker = L.marker([defaultLat, defaultLng], { icon: customIcon }).addTo(map);

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng], 15);
                marker.setLatLng([lat, lng]);
            });
        }

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
        });
    }

    async function saveNewAddress() {
        const label = document.getElementById('addr-label').value.trim();
        const building = document.getElementById('addr-building').value.trim();
        const floor = document.getElementById('addr-floor').value.trim();
        const details = document.getElementById('addr-details').value.trim();
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

        if (!label) {
            showToast('Address Name is required', 'error');
            return;
        }

        if (!building) {
            showToast('Building Number/Name is required', 'error');
            return;
        }

        const lat = marker ? marker.getLatLng().lat : null;
        const lng = marker ? marker.getLatLng().lng : null;

        const payload = {
            email: currentUser.email,
            label: label,
            building: building,
            floor: floor,
            details: details,
            latitude: lat,
            longitude: lng
        };

        const btn = document.getElementById('btn-save-address');
        const origContent = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Saving...';
        btn.disabled = true;

        const method = editingAddressId ? 'PUT' : 'POST';
        const url = editingAddressId ? `/api/addresses/${editingAddressId}` : '/api/addresses';

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                showToast(editingAddressId ? 'Address updated successfully' : 'Address saved successfully', 'success');
                closeNewAddressModal();
                fetchUserAddresses();
            } else {
                showToast('Failed to save address', 'error');
            }
        } catch (err) {
            console.error(err);
            showToast('Error saving address', 'error');
        } finally {
            btn.innerHTML = origContent;
            btn.disabled = false;
        }
    }

    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toast-msg');
        const icon = document.getElementById('toast-icon');
        
        msg.textContent = message;
        
        if (type === 'success') {
            toast.firstElementChild.className = 'bg-primary text-white px-6 py-3 rounded-full shadow-ambient font-medium text-sm flex items-center gap-2';
            icon.textContent = 'check_circle';
        } else if (type === 'error') {
            toast.firstElementChild.className = 'bg-red-500 text-white px-6 py-3 rounded-full shadow-ambient font-medium text-sm flex items-center gap-2';
            icon.textContent = 'error';
        } else {
            toast.firstElementChild.className = 'bg-text text-white px-6 py-3 rounded-full shadow-ambient font-medium text-sm flex items-center gap-2';
            icon.textContent = 'info';
        }
        
        toast.classList.remove('opacity-0', '-translate-y-4');
        
        setTimeout(() => {
            toast.classList.add('opacity-0', '-translate-y-4');
        }, 3000);
    }
</script>
</body>
</html>
