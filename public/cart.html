<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="utf-8"/>
<meta name="viewport" content="width=400, user-scalable=no">
<title>Ghiras Alkhier - Shopping Cart</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<script src="purify.min.js"></script>
    <script src="loader.js"></script>
<script>
    if (!localStorage.getItem('currentUser') || !localStorage.getItem('token')) {
        window.location.href = 'index.html';
    }
</script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                },
                colors: {
                    primary: '#135c38',
                    'primary-light': '#bcebd2',
                    surface: '#fbf9f8',
                    'surface-dim': '#f5f3f3',
                    text: '#3d4943',
                    'text-muted': '#6b7a73',
                },
                borderRadius: {
                    '4xl': '2rem',
                }
            }
        }
    }
</script>
<style type="text/tailwindcss">
    @layer utilities {
        .shadow-soft { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        .shadow-ambient { box-shadow: 0 12px 40px rgba(19, 92, 56, 0.08); }
    }
    body {
        background-color: theme('colors.surface');
        color: theme('colors.text');
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="antialiased font-sans flex flex-col h-full">
<!-- Header -->
<header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md px-4 py-4 flex items-center justify-between border-b border-surface-dim">
    <button aria-label="Back" class="min-w-[48px] min-h-[48px] flex items-center justify-center text-primary hover:bg-surface-dim rounded-full transition-colors" onclick="window.history.back()">
        <span class="material-symbols-outlined text-[24px]">arrow_back</span>
    </button>
    <h1 class="text-lg font-bold text-primary flex-1 text-center pr-12">Your Cart</h1>
</header>

<main class="flex-1 px-4 py-6 pb-28 space-y-6 max-w-xl mx-auto w-full">
    <!-- Cart Items -->
    <div class="space-y-4" id="cart-items-container">
        <!-- Item 1 -->
        <article class="bg-white rounded-3xl p-3 shadow-soft flex gap-4 transition-all">
            <div class="relative w-24 h-24 shrink-0 rounded-2xl overflow-hidden bg-[#e8ebe6]">
                <img alt="Monstera Deliciosa plant in a pot" class="w-full h-full object-cover mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBm8MgJd0-aWsUjuIac8v5lpBPgCI0hOWrrKv1KDeq4L8K7AhcJ7B9mhgUk-XnSRRMBJfz2NqQ6QTZJwuc1oLU6pzPS26kZnbrNd4QVjYqlgxDm1RGTx_MJhh_PytXXJdSwGsq5UpfLiDjprVozaraOD3rXq-Lb7LphG6zmgWClBp6E2r0zvvY_dtKqI6n_LmC3r3hq_e6wPMd76_rD100NhPHgyiXWKCiLRDavbdU3yctc_WiM3YlbtDqd7f2jhrz3lGZg8zLfh7Yb" />
            </div>
            <div class="flex-1 flex flex-col justify-between py-1">
                <div>
                    <div class="flex justify-between items-start">
                        <h3 class="font-semibold text-primary text-sm leading-tight">Monstera Deliciosa</h3>
                        <button class="text-text-muted hover:text-red-500 transition-colors">
                            <span class="material-symbols-outlined text-[18px]">delete</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-end justify-between mt-2">
                    <p class="font-bold text-primary text-base">JOD 45.00</p>
                    <div class="flex items-center bg-surface-dim rounded-full p-1">
                        <button class="w-7 h-7 flex items-center justify-center text-text hover:bg-white rounded-full transition-colors shadow-sm">
                            <span class="material-symbols-outlined text-[16px]">remove</span>
                        </button>
                        <span class="w-8 text-center text-sm font-semibold text-text">1</span>
                        <button class="w-7 h-7 flex items-center justify-center bg-primary text-white rounded-full shadow-sm hover:bg-primary/90 transition-all">
                            <span class="material-symbols-outlined text-[16px]">add</span>
                        </button>
                    </div>
                </div>
            </div>
        </article>
        <!-- Item 2 -->
        <article class="bg-white rounded-3xl p-3 shadow-soft flex gap-4 transition-all">
            <div class="relative w-24 h-24 shrink-0 rounded-2xl overflow-hidden bg-[#e2e8e0]">
                <img alt="Fiddle Leaf Fig plant indoor" class="w-full h-full object-cover mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8HuXLsehMXenHq7t2ow83QpRJdBc1CKLrXPJeMRAteXZLPMxCN9CWMI_TY4xa1mhxvPm3h04jQkptkCWKnLBrrRaVeY3o7xec_Ei56RWppJOmCZRObu5EHjKWhbNISxShLPi4oc7Wvez0k7gsxAskmM8uRPABdewhYlwT38zDWxPn3feGyZyLG_7jm4GsIDToA_KFYOPkTledS4GqZHIrN7LWz4C3x5awWDseD9wpD1IZI2s-o3XAgZFRmwepzRdqzeQBoEaPqQh4" />
            </div>
            <div class="flex-1 flex flex-col justify-between py-1">
                <div>
                    <div class="flex justify-between items-start">
                        <h3 class="font-semibold text-primary text-sm leading-tight">Fiddle Leaf Fig</h3>
                        <button class="text-text-muted hover:text-red-500 transition-colors">
                            <span class="material-symbols-outlined text-[18px]">delete</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-end justify-between mt-2">
                    <p class="font-bold text-primary text-base">JOD 120.00</p>
                    <div class="flex items-center bg-surface-dim rounded-full p-1">
                        <button class="w-7 h-7 flex items-center justify-center text-text hover:bg-white rounded-full transition-colors shadow-sm">
                            <span class="material-symbols-outlined text-[16px]">remove</span>
                        </button>
                        <span class="w-8 text-center text-sm font-semibold text-text">1</span>
                        <button class="w-7 h-7 flex items-center justify-center bg-primary text-white rounded-full shadow-sm hover:bg-primary/90 transition-all">
                            <span class="material-symbols-outlined text-[16px]">add</span>
                        </button>
                    </div>
                </div>
            </div>
        </article>
    </div>

    <!-- Promo Code -->
    <div class="pt-2">
        <div class="bg-white p-2 pr-2 rounded-full flex items-center border border-surface-dim focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all shadow-sm">
            <span class="material-symbols-outlined text-text-muted ml-3">sell</span>
            <input class="bg-transparent border-none text-sm w-full focus:ring-0 text-text placeholder-text-muted ml-2 outline-none" placeholder="Promo Code" type="text" />
            <button class="bg-primary text-white px-5 py-2.5 rounded-full text-sm font-medium hover:bg-primary/90 transition-colors ml-2">Apply</button>
        </div>
    </div>

    <!-- Order Summary -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-surface-dim space-y-3">
        <div class="flex justify-between items-center text-sm text-text-muted">
            <span>Subtotal</span>
            <span class="font-medium text-text">JOD 165.00</span>
        </div>
        <div class="flex justify-between items-center text-sm text-text-muted">
            <span>Shipping</span>
            <span class="font-medium text-text">JOD 15.00</span>
        </div>
        <div class="flex justify-between items-center text-sm text-text-muted">
            <span>Tax (5%)</span>
            <span class="font-medium text-text">JOD 8.25</span>
        </div>
        <div class="h-px bg-surface-dim my-2"></div>
        <div class="flex justify-between items-center text-base">
            <span class="font-semibold text-primary">Total</span>
            <span class="font-bold text-lg text-primary">JOD 188.25</span>
        </div>
    </div>
</main>

<!-- Fixed Checkout Bar -->
<div class="fixed bottom-24 left-0 right-0 w-full px-4 z-40 max-w-xl mx-auto">
    <button class="w-full min-h-[56px] bg-primary text-white text-base font-medium rounded-full shadow-ambient hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="window.location.href='checkout.html'">
        Proceed to Checkout
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
    </button>
</div>




<!-- Checkout Button Area -->
        <div class="p-6 border-t border-gray-200 bg-[#fbf9f8]/90 backdrop-blur-md pb-8">
            <button class="w-full min-h-[56px] bg-[#135c38] text-white text-base font-medium rounded-full shadow-soft hover:bg-[#135c38]/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="window.location.href='checkout.html'">
                Proceed to Checkout
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
        </div>
    </div>
</div>


<!-- Cart Modal -->
<div id="cart-modal" class="fixed inset-0 z-[100] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div id="cart-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity duration-300 opacity-0" onclick="toggleCart()"></div>

    <!-- Modal Panel -->
    <div id="cart-panel" class="fixed bottom-0 left-0 right-0 max-w-2xl mx-auto bg-[#fbf9f8] rounded-t-4xl shadow-[0_-12px_40px_rgba(19,92,56,0.12)] transform transition-transform duration-300 ease-out translate-y-full top-[15%] flex flex-col border border-white/50">
        <!-- Handle for dragging (visual cue) -->
        <div class="w-full flex justify-center pt-4 pb-2 cursor-pointer" onclick="toggleCart()">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>

        <!-- Header -->
        <div class="px-6 py-4 flex items-center justify-between border-b border-gray-200">
            <h2 class="text-lg font-semibold text-[#135c38]">Your Cart</h2>
            <button class="w-10 h-10 flex items-center justify-center bg-gray-100 rounded-full text-gray-700 hover:bg-[#135c38] hover:text-white transition-colors" onclick="toggleCart()">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6">
            <!-- Cart Items List -->
            <div id="cart-items-container" class="space-y-4">
                <!-- Items will be rendered here by cart.js -->
            </div>
            
            <!-- Promo Code -->
            <div class="pt-2">
                <div class="bg-white p-2 pr-2 rounded-full flex items-center border border-gray-200 focus-within:ring-2 focus-within:ring-[#135c38]/20 focus-within:border-[#135c38] transition-all shadow-sm">
                    <span class="material-symbols-outlined text-gray-400 ml-3">sell</span>
                    <input class="bg-transparent border-none text-sm w-full focus:ring-0 text-gray-800 placeholder-gray-400 ml-2 outline-none" placeholder="Promo Code" type="text" />
                    <button class="bg-[#135c38] text-white px-5 py-2.5 rounded-full text-sm font-medium hover:bg-[#135c38]/90 transition-colors ml-2">Apply</button>
                </div>
            </div>
            
            <!-- Order Summary -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200 space-y-3 mb-6">
                <div class="flex justify-between items-center text-sm text-gray-500">
                    <span>Subtotal</span>
                    <span id="cart-subtotal" class="font-medium text-gray-800">JOD 0.00</span>
                </div>
                <div class="h-px bg-gray-200 my-2"></div>
                <div class="flex justify-between items-center text-base">
                    <span class="font-semibold text-[#135c38]">Total</span>
                    <span id="cart-total" class="font-bold text-lg text-[#135c38]">JOD 0.00</span>
                </div>
            </div>
        </div>

        <!-- Checkout Button Area -->
        <div class="p-6 border-t border-gray-200 bg-[#fbf9f8]/90 backdrop-blur-md pb-8">
            <button class="w-full min-h-[56px] bg-[#135c38] text-white text-base font-medium rounded-full shadow-soft hover:bg-[#135c38]/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="window.location.href='checkout.html'">
                Proceed to Checkout
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
            </button>
        </div>
    </div>
</div>


<!-- Bottom Navigation -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-sm bg-white/80 backdrop-blur-xl border border-white/40 shadow-ambient rounded-full px-6 py-3 z-50 flex justify-between items-center">
    <a href="home.html" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#135c38] transition-colors">
        <span class="material-symbols-outlined text-[24px]" >home</span>
        <span class="text-[10px] font-medium tracking-wide">Home</span>
    </a>
    <a href="product.html" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#135c38] transition-colors">
        <span class="material-symbols-outlined text-[24px]" >grid_view</span>
        <span class="text-[10px] font-medium tracking-wide">Shop</span>
    </a>
    <button onclick="toggleCart()" class="flex flex-col items-center gap-1 text-[#135c38] transition-colors relative">
        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
        <span class="text-[10px] font-medium tracking-wide">Cart</span>
        <span class="cart-badge absolute -top-1 -right-2 bg-[#f8deb1] text-[#a66a1a] text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-white hidden">0</span>
    </button>
    <a href="profile.html" class="flex flex-col items-center gap-1 text-gray-500 hover:text-[#135c38] transition-colors">
        <span class="material-symbols-outlined text-[24px]" >person</span>
        <span class="text-[10px] font-medium tracking-wide">Profile</span>
    </a>
</nav>

<script src="cart.js"></script>
</body>
</html>
